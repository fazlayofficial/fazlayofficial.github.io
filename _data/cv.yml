  Projects:
    - name: "Quantifying Sustained Attention and Distraction in Children with ADHD Using Augmented Reality Literacy Tasks and Automated Computer Vision"
      summary: "Developed an automated computer vision framework to quantify sustained attention duration and distraction frequency in children with ADHD during augmented reality-based literacy tasks. Processed video streams from an AR literacy application (3D letter and object overlays on iPad) to train supervised models on annotated datasets, enabling real-time, annotation-free behavioral analysis. Implemented deep learning pipelines for gaze estimation, head-pose tracking, and behavioral feature extraction to facilitate objective ADHD assessment without manual observation."
      highlights:
        - "Role: Collaborator"
        - "Supervisor: Dr. A.B.M. Sayeed Ud Doulah"
        - "Tech: Python, OpenCV, MediaPipe, TensorFlow/Keras, Machine Learning, AR"
      start_date: ""
      end_date: ""
    - name: "Adaptive TinyML-Based sEMG Wheelchair Control System"
      summary: "Designing an Adaptive TinyML framework to control a robotic wheelchair using Surface Electromyography (sEMG) signals. Implementing a lightweight Convolutional Neural Network (CNN) on an Esp32 edge device, utilizing int8 quantization to reduce model footprint by 65%. Optimized the system for real-time inference with latency <100ms, enabling fluid motor control for disabled users. Addressing \"concept drift\" in bio-signals by experimenting with on-device transfer learning techniques."
      highlights:
        - "Role: Hardware Lead"
        - "Tech: TinyML, Edge Impulse, EMG Sensors"
      start_date: ""
      end_date: ""
    - name: "SmartBowel Wear: Textile-Based Colorectal Cancer Risk Stratification"
      summary: "Designing a wearable belt integrating MEMS acoustic sensors for continuous bowel sound monitoring with on-device DSP and TinyML-based classification. Developing a preprocessing pipeline (bandpass filtering, spectrogram generation) optimized using Cortex-M7 SIMD instructions for real-time edge inference. Training lightweight CNN architectures for colorectal cancer risk stratification targeting deployment in low-resource and underserved populations."
      highlights:
        - "Role: Collaborator"
        - "Supervisor: Dr. A.B.M. Sayeed Ud Doulah"
        - "Tech: STM32H7 (Cortex-M7), C/C++, MEMS Microphones, Bluetooth LE, DSP, TinyML"
      start_date: ""
      end_date: ""
